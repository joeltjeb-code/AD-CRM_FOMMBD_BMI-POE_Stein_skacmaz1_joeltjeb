# Vibe Lab. Gemeinsame Projekt-Konfiguration.
# Enthaelt KEINE Secrets. Alle Werkzeuge hier laufen ohne zusaetzliches Konto.

default_agent = "plan"

# Nur Mistral-Modelle auswählbar. Schliesst GLM und andere Fremdmodelle aus,
# die eure Credits sehr schnell verbrauchen, ebenso das lokale Devstral,
# das im Codespace nicht laeuft. Das Standardmodell heisst intern
# mistral-vibe-cli-latest und faellt unter mistral-*.
allowed_models = ["mistral-*"]
enable_telemetry = false

# Alle Skills aus .vibe/skills aktivieren
enabled_skills = ["*"]

# --- Werkzeuge (MCP), ohne Key ---

# Aktuelle Dokumentation zu Bibliotheken und Frameworks
[[mcp_servers]]
name = "context7"
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 120

# Eine Webseite abrufen und als Text lesen
[[mcp_servers]]
name = "fetch"
transport = "stdio"
command = "uvx"
args = ["mcp-server-fetch"]
startup_timeout_sec = 120
